<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Replaced local favicon with an inline SVG to prevent broken icons in preview -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn46uPC90ZXh0Pjwvc3ZnPg==" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Demo</title>
    <!-- Start downloading the sprite atlas and first map while the JS loads. -->
    <link rel="preload" href="/atlas/sprites.json" as="fetch" crossorigin />
    <link rel="preload" href="/maps/dungeon_adventure.json" as="fetch" crossorigin />
  </head>
  <body>
    <div id="app">
      <div class="game-container">
        <!-- Scale the canvas down slightly via CSS to fit typical previews nicely, keeps pixel aspect ratio -->
        <div class="game-stage" id="gameStage">
        <!-- The frame is sized to the canvas, so the HUD stays anchored to the map -->
        <div class="canvas-frame" id="canvasFrame">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>

        <div id="hudOverlay" class="hud-overlay">

          <!-- Top Left: Health -->
          <div class="hud-element health-display">
            HP <span id="playerHealth">100/100</span>
            <div class="hp-bar"><div id="playerHealthBar" class="hp-bar-fill"></div></div>
            <div class="score-display">SCORE <span id="scoreValue">0</span></div>
            <div class="keys-display">KEYS <span id="keyCount">0</span></div>
          </div>

          <!-- End screen -->
          <div id="endScreen" class="end-screen">
            <h1 id="endTitle">GAME OVER</h1>
            <p id="endScore"></p>
            <button id="restartButton" class="engine-button">PLAY AGAIN</button>
          </div>

          <!-- Top Right: Collapsible Menu -->
          <div class="menu-container">
            <button id="menuToggleButton" class="engine-button">Menu ☰</button>
            <div id="hudButtons" class="hud-buttons">
              <button id="muteButton" class="engine-button">Mute</button>
              <button id="pauseButton" class="engine-button btn-danger">Pause</button>
              <button id="saveButton" class="engine-button btn-success">Save</button>
              <button id="loadButton" class="engine-button btn-primary">Load</button>
              <button id="skipDialogueButton" class="engine-button btn-warning">Skip</button>
            </div>
          </div>

          <!-- Bottom Right: Inventory Bag -->
          <button id="inventoryButton" class="engine-button bag-button">🎒</button>

          <!-- Bottom Left: Dev Tools -->
          <div class="dev-tools-wrapper">
            <div id="devToolsPanel" class="engine-panel dev-tools-panel">
              <div id="fpsCounter" class="fps-counter">FPS: --</div>
              <div><strong>Player:</strong> <span id="playerCoords">0, 0</span></div>
              <div><strong>Mouse:</strong> <span id="mouseCoords">0, 0</span></div>
            </div>
            <label class="dev-tools-toggle">
              <input type="checkbox" id="devToolsCheckbox"> Dev Tools
            </label>
          </div>

        </div>
        </div>
        </div>

        <!-- Right side panel: kept off the map so the text stays readable -->
        <aside class="side-panel">
          <section class="level-section">
            <h2>LEVEL</h2>
            <p id="levelDisplay">Level 1</p>
          </section>
          <section>
            <h2>QUEST</h2>
            <p>Find the keys, open the gates and reach the exit.</p>
          </section>
          <section>
            <h2>CONTROLS</h2>
            <ul class="controls-list">
              <li><span class="key">R-CLICK</span> Move</li>
              <li><span class="key">L-CLICK</span> Open, fight, pick up</li>
            </ul>
          </section>
          <section class="log-section">
            <h2>LOG</h2>
            <ul id="messageLog" class="message-log"></ul>
          </section>
        </aside>
      </div>

      <!-- Dialogue Box -->
      <div id="dialogueBox" class="engine-panel dialogue-box">
        <p id="dialogueSpeaker" class="dialogue-speaker"></p>
        <p id="dialogueText" class="dialogue-text"></p>
        <div class="dialogue-prompt">▼ Click to continue ▼</div>
      </div>

      <!-- Inventory Panel -->
      <div id="inventoryPanel" class="engine-panel inventory-panel">
        <h2 class="panel-title">Inventory</h2>
        <ul id="inventoryList" class="inventory-list">
          <!-- Inventory items populated by engine -->
        </ul>
        <div class="close-prompt">Click the Bag icon to close</div>
      </div>
    </div>

    <!-- UI Toggle Logic -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Menu Toggle
        const menuBtn = document.getElementById('menuToggleButton');
        const hudBtns = document.getElementById('hudButtons');
        menuBtn.addEventListener('click', () => {
          hudBtns.classList.toggle('open');
        });

        // Dev Tools Toggle
        const devCheckbox = document.getElementById('devToolsCheckbox');
        const devPanel = document.getElementById('devToolsPanel');
        devCheckbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            devPanel.classList.add('open');
          } else {
            devPanel.classList.remove('open');
          }
        });
      });
    </script>

    <!-- The actual game engine script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
